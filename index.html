<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who Lied? — Logic Deduction Puzzle</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { font-family: 'Segoe UI', system-ui, sans-serif; }
  .suspect-card { transition: all 0.2s ease; }
  .suspect-card.knight { border-color: #22d3ee; box-shadow: 0 0 12px rgba(34,211,238,0.3); }
  .suspect-card.liar  { border-color: #f87171; box-shadow: 0 0 12px rgba(248,113,113,0.3); }
  .suspect-card.unset { border-color: #374151; }
  .step-entry { animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(-4px); } to { opacity:1; transform:translateY(0); } }
  .tab-active { background: #1e40af; color:#fff; }
  .tab-inactive { background: #1f2937; color:#9ca3af; }
</style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen">

<div class="max-w-3xl mx-auto p-4">
  <!-- Header -->
  <div class="text-center mb-6">
    <h1 class="text-3xl font-bold text-cyan-400 mb-1">Who Lied?</h1>
    <p class="text-gray-400 text-sm">Logic deduction puzzle — find the liars among the witnesses</p>
  </div>

  <!-- Stats bar -->
  <div class="flex gap-3 justify-center mb-5 text-sm">
    <div class="bg-gray-800 rounded-lg px-4 py-2 text-center">
      <div class="text-yellow-400 font-bold" id="stat-streak">0</div>
      <div class="text-gray-500 text-xs">Streak</div>
    </div>
    <div class="bg-gray-800 rounded-lg px-4 py-2 text-center">
      <div class="text-green-400 font-bold" id="stat-solved">0</div>
      <div class="text-gray-500 text-xs">Solved</div>
    </div>
    <div class="bg-gray-800 rounded-lg px-4 py-2 text-center">
      <div class="text-cyan-400 font-bold" id="stat-time">0:00</div>
      <div class="text-gray-500 text-xs">Time</div>
    </div>
    <div class="bg-gray-800 rounded-lg px-4 py-2 text-center">
      <div class="text-orange-400 font-bold" id="stat-hints">0</div>
      <div class="text-gray-500 text-xs">Hints</div>
    </div>
  </div>

  <!-- Difficulty tabs -->
  <div class="flex gap-2 mb-4 justify-center">
    <button onclick="setDifficulty('easy')" id="tab-easy" class="tab-btn rounded-full px-5 py-1.5 text-sm font-semibold transition-all" aria-label="Easy difficulty">Easy</button>
    <button onclick="setDifficulty('medium')" id="tab-medium" class="tab-btn rounded-full px-5 py-1.5 text-sm font-semibold transition-all" aria-label="Medium difficulty">Medium</button>
    <button onclick="setDifficulty('hard')" id="tab-hard" class="tab-btn rounded-full px-5 py-1.5 text-sm font-semibold transition-all" aria-label="Hard difficulty">Hard</button>
  </div>

  <!-- Puzzle area -->
  <div id="puzzle-panel" class="bg-gray-800 rounded-2xl p-5 mb-4">
    <div class="flex items-center justify-between mb-3">
      <div>
        <span class="text-gray-400 text-xs uppercase tracking-wider">Puzzle</span>
        <span id="puzzle-num" class="ml-2 text-white font-bold">#1</span>
        <span id="puzzle-diff-badge" class="ml-2 text-xs px-2 py-0.5 rounded-full bg-green-900 text-green-300">Easy</span>
      </div>
      <button onclick="loadNextPuzzle()" class="text-xs bg-gray-700 hover:bg-gray-600 rounded-lg px-3 py-1.5 transition-colors" aria-label="Next puzzle">Next →</button>
    </div>
    <p id="puzzle-desc" class="text-gray-300 text-sm mb-4 italic"></p>

    <!-- Suspects -->
    <div id="suspects-grid" class="grid grid-cols-2 gap-3 mb-4 sm:grid-cols-3"></div>

    <!-- Action buttons -->
    <div class="flex flex-wrap gap-2">
      <button onclick="checkSolution()" class="bg-cyan-700 hover:bg-cyan-600 rounded-lg px-4 py-2 text-sm font-semibold transition-colors" aria-label="Check your solution">Check Answer</button>
      <button onclick="useHint()" class="bg-yellow-700 hover:bg-yellow-600 rounded-lg px-4 py-2 text-sm font-semibold transition-colors" aria-label="Get a hint">Hint 💡</button>
      <button onclick="showSolution()" class="bg-gray-700 hover:bg-gray-600 rounded-lg px-4 py-2 text-sm font-semibold transition-colors" aria-label="Reveal solution">Show Solution</button>
      <button onclick="resetPuzzle()" class="bg-red-900 hover:bg-red-800 rounded-lg px-4 py-2 text-sm font-semibold transition-colors" aria-label="Reset puzzle">Reset</button>
    </div>
  </div>

  <!-- Feedback area -->
  <div id="feedback" class="hidden bg-gray-800 rounded-2xl p-4 mb-4"></div>

  <!-- Solution steps -->
  <div id="solution-panel" class="hidden bg-gray-800 rounded-2xl p-5">
    <h2 class="text-cyan-400 font-bold mb-3">Step-by-Step Solution</h2>
    <ol id="solution-steps" class="space-y-2 text-sm text-gray-300"></ol>
  </div>
</div>

// ---- State ----
let currentPuzzle = null;
let assignments = {}; // name -> 'knight' | 'liar' | null
let hintsUsed = 0;
let timerInterval = null;
let timerSeconds = 0;
let difficulty = 'easy';
let sessionStats = { streak:0, solved:0 };
let puzzleIndex = { easy:0, medium:0, hard:0 };

function loadStats() {
  try {
    const s = JSON.parse(localStorage.getItem('liar-puzzle-stats') || '{}');
    sessionStats.streak = s.streak || 0;
    sessionStats.solved = s.solved || 0;
    puzzleIndex = s.puzzleIndex || { easy:0, medium:0, hard:0 };
  } catch(e){}
  updateStatDisplay();
}

function saveStats() {
  localStorage.setItem('liar-puzzle-stats', JSON.stringify({
    streak: sessionStats.streak,
    solved: sessionStats.solved,
    puzzleIndex
  }));
}

function updateStatDisplay() {
  document.getElementById('stat-streak').textContent = sessionStats.streak;
  document.getElementById('stat-solved').textContent = sessionStats.solved;
  document.getElementById('stat-hints').textContent = hintsUsed;
}

function setDifficulty(d) {
  difficulty = d;
  ['easy','medium','hard'].forEach(x => {
    const el = document.getElementById('tab-'+x);
    el.className = 'tab-btn rounded-full px-5 py-1.5 text-sm font-semibold transition-all ' +
      (x === d ? 'tab-active' : 'tab-inactive');
  });
  loadPuzzleByDifficulty();
}

function loadPuzzleByDifficulty() {
  const pool = PUZZLES.filter(p => p.difficulty === difficulty);
  const idx = puzzleIndex[difficulty] % pool.length;
  currentPuzzle = pool[idx];
  hintsUsed = 0;
  resetPuzzleState();
  renderPuzzle();
  startTimer();
}

function loadNextPuzzle() {
  puzzleIndex[difficulty] = (puzzleIndex[difficulty] + 1);
  saveStats();
  loadPuzzleByDifficulty();
}

function resetPuzzle() {
  hintsUsed = 0;
  resetPuzzleState();
  renderPuzzle();
}

function resetPuzzleState() {
  assignments = {};
  currentPuzzle.people.forEach(p => assignments[p] = null);
  document.getElementById('feedback').className = 'hidden bg-gray-800 rounded-2xl p-4 mb-4';
  document.getElementById('solution-panel').className = 'hidden bg-gray-800 rounded-2xl p-5';
  updateStatDisplay();
}

function renderPuzzle() {
  const p = currentPuzzle;
  document.getElementById('puzzle-num').textContent = '#' + p.id;
  const badge = document.getElementById('puzzle-diff-badge');
  badge.textContent = p.difficulty.charAt(0).toUpperCase() + p.difficulty.slice(1);
  badge.className = 'ml-2 text-xs px-2 py-0.5 rounded-full ' +
    (p.difficulty==='easy' ? 'bg-green-900 text-green-300' :
     p.difficulty==='medium' ? 'bg-yellow-900 text-yellow-300' :
     'bg-red-900 text-red-300');
  document.getElementById('puzzle-desc').textContent = p.desc;

  const grid = document.getElementById('suspects-grid');
  grid.innerHTML = '';
  p.people.forEach(name => {
    const stmt = p.statements.find(s => s.speaker === name);
    const card = document.createElement('div');
    card.id = 'card-' + name;
    card.className = 'suspect-card unset border-2 rounded-xl p-3 bg-gray-750';
    card.style.background = '#1f2937';
    card.innerHTML = `
      <div class="flex items-center gap-2 mb-2">
        <div class="w-8 h-8 rounded-full bg-gray-600 flex items-center justify-center text-sm font-bold text-white">${name[0]}</div>
        <span class="font-semibold text-white">${name}</span>
        <span id="badge-${name}" class="ml-auto text-xs px-2 py-0.5 rounded-full bg-gray-700 text-gray-400">?</span>
      </div>
      <p class="text-gray-400 text-xs italic mb-3">"${stmt ? stmt.text : ''}"</p>
      <div class="flex gap-2">
        <button onclick="setAssignment('${name}','knight')" class="flex-1 text-xs py-1.5 rounded-lg border transition-all ${assignments[name]==='knight' ? 'border-cyan-400 bg-cyan-900 text-cyan-300' : 'border-gray-600 text-gray-400 hover:border-cyan-500'}" aria-label="Mark ${name} as Knight (truth-teller)">Knight</button>
        <button onclick="setAssignment('${name}','liar')" class="flex-1 text-xs py-1.5 rounded-lg border transition-all ${assignments[name]==='liar' ? 'border-red-400 bg-red-900 text-red-300' : 'border-gray-600 text-gray-400 hover:border-red-500'}" aria-label="Mark ${name} as Liar">Liar</button>
      </div>`;
    grid.appendChild(card);
  });
}

function setAssignment(name, type) {
  assignments[name] = assignments[name] === type ? null : type;
  renderSuspectCard(name);
}

function renderSuspectCard(name) {
  const p = currentPuzzle;
  const stmt = p.statements.find(s => s.speaker === name);
  const asgn = assignments[name];
  const card = document.getElementById('card-'+name);
  card.className = 'suspect-card border-2 rounded-xl p-3 ' +
    (asgn === 'knight' ? 'knight' : asgn === 'liar' ? 'liar' : 'unset');
  card.style.background = '#1f2937';
  const badge = document.getElementById('badge-'+name);
  if (asgn === 'knight') { badge.textContent = 'Knight'; badge.className = 'ml-auto text-xs px-2 py-0.5 rounded-full bg-cyan-900 text-cyan-300'; }
  else if (asgn === 'liar') { badge.textContent = 'Liar'; badge.className = 'ml-auto text-xs px-2 py-0.5 rounded-full bg-red-900 text-red-300'; }
  else { badge.textContent = '?'; badge.className = 'ml-auto text-xs px-2 py-0.5 rounded-full bg-gray-700 text-gray-400'; }
  card.querySelectorAll('button').forEach(btn => {
    if (btn.textContent.trim() === 'Knight') {
      btn.className = 'flex-1 text-xs py-1.5 rounded-lg border transition-all ' +
        (asgn==='knight' ? 'border-cyan-400 bg-cyan-900 text-cyan-300' : 'border-gray-600 text-gray-400 hover:border-cyan-500');
    } else {
      btn.className = 'flex-1 text-xs py-1.5 rounded-lg border transition-all ' +
        (asgn==='liar' ? 'border-red-400 bg-red-900 text-red-300' : 'border-gray-600 text-gray-400 hover:border-red-500');
    }
  });
}

function checkSolution() {
  const p = currentPuzzle;
  const allSet = p.people.every(name => assignments[name] !== null);
  if (!allSet) { showFeedback('warning', 'Please assign Knight or Liar to every person first.'); return; }

  const correct = p.liars;
  const userLiars = p.people.filter(name => assignments[name] === 'liar');
  const isCorrect = correct.length === userLiars.length && correct.every(n => userLiars.includes(n));

  if (isCorrect) {
    stopTimer();
    sessionStats.solved++;
    sessionStats.streak++;
    saveStats();
    updateStatDisplay();
    showFeedback('success', `Correct! You identified the ${correct.length === 1 ? 'liar' : 'liars'} in ${formatTime(timerSeconds)} using ${hintsUsed} hint${hintsUsed !== 1 ? 's' : ''}. 🎉`);
  } else {
    sessionStats.streak = 0;
    saveStats();
    updateStatDisplay();
    const wrongLiars = userLiars.filter(n => !correct.includes(n));
    const missedLiars = correct.filter(n => !userLiars.includes(n));
    let msg = 'Not quite. ';
    if (wrongLiars.length) msg += `${wrongLiars.join(', ')} ${wrongLiars.length===1?'is':'are'} not a liar. `;
    if (missedLiars.length) msg += `You missed a liar among the others.`;
    showFeedback('error', msg);
  }
}

function useHint() {
  const p = currentPuzzle;
  // Find first person incorrectly assigned
  for (const name of p.people) {
    const correctType = p.liars.includes(name) ? 'liar' : 'knight';
    if (assignments[name] !== correctType) {
      hintsUsed++;
      updateStatDisplay();
      const action = assignments[name] === null ? 'is unassigned' : `is incorrectly marked as ${assignments[name]}`;
      showFeedback('hint', `Hint: Consider ${name}'s statement more carefully — their current status ${action}.`);
      // Flash the card
      const card = document.getElementById('card-'+name);
      card.style.outline = '2px solid #facc15';
      setTimeout(() => card.style.outline = '', 2000);
      return;
    }
  }
  showFeedback('hint', 'All current assignments are correct so far!');
}

function showSolution() {
  const p = currentPuzzle;
  // Set correct assignments
  p.people.forEach(name => {
    assignments[name] = p.liars.includes(name) ? 'liar' : 'knight';
    renderSuspectCard(name);
  });
  const panel = document.getElementById('solution-panel');
  panel.className = 'bg-gray-800 rounded-2xl p-5';
  const steps = document.getElementById('solution-steps');
  steps.innerHTML = p.solution.map((step, i) =>
    `<li class="step-entry flex gap-2 items-start"><span class="text-cyan-400 font-bold min-w-[1.5rem]">${i+1}.</span><span>${step}</span></li>`
  ).join('');
}

function showFeedback(type, msg) {
  const el = document.getElementById('feedback');
  const colors = {
    success: 'bg-green-900 border border-green-600 text-green-200',
    error:   'bg-red-900 border border-red-600 text-red-200',
    warning: 'bg-yellow-900 border border-yellow-600 text-yellow-200',
    hint:    'bg-blue-900 border border-blue-600 text-blue-200'
  };
  el.className = `rounded-2xl p-4 mb-4 ${colors[type]}`;
  el.textContent = msg;
}

function startTimer() {
  stopTimer();
  timerSeconds = 0;
  updateTimerDisplay();
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimerDisplay();
  }, 1000);
}

function stopTimer() {
  if (timerInterval) clearInterval(timerInterval);
}

function updateTimerDisplay() {
  document.getElementById('stat-time').textContent = formatTime(timerSeconds);
}

function formatTime(s) {
  return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0');
}

// ---- Init ----
loadStats();
setDifficulty('easy');
</script>
</body>
</html>
